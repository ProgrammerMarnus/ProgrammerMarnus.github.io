<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Real-Time Room</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #18252b;
            --muted: #607178;
            --paper: #f5f1e8;
            --panel: #fffdf8;
            --line: #d9d2c4;
            --accent: #d65a3a;
            --accent-dark: #a93b27;
            --mine: #e6f0e8;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 48px 20px;
            color: var(--ink);
            background: radial-gradient(circle at 15% 10%, #fff8dc 0, transparent 32%), var(--paper);
            font-family: Georgia, 'Times New Roman', serif;
        }

        main { width: min(760px, 100%); margin: 0 auto; }

        header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
        h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.7rem); line-height: .95; letter-spacing: 0; }
        .eyebrow { margin: 0 0 8px; color: var(--accent-dark); font: 700 .75rem/1.2 Arial, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
        .subtitle { max-width: 180px; margin: 0 0 3px; color: var(--muted); font: .9rem/1.4 Arial, sans-serif; text-align: right; }

        .chat-panel { overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); box-shadow: 0 18px 45px #7e6b4d18; }
        #messages { height: min(54vh, 470px); overflow-y: auto; padding: 22px; }
        #messages:empty::before { content: 'No messages yet. Start the conversation.'; color: var(--muted); font: .95rem Arial, sans-serif; }
        #messages p { margin: 0 0 14px; padding: 11px 14px; border-left: 3px solid var(--line); background: #faf8f2; font-size: 1rem; line-height: 1.45; overflow-wrap: anywhere; }
        #messages p:last-child { margin-bottom: 0; }
        #messages b { color: var(--accent-dark); }

        .composer { display: grid; grid-template-columns: 150px 1fr auto; gap: 10px; padding: 14px; border-top: 1px solid var(--line); background: #f8f4eb; }
        input { min-width: 0; padding: 12px 13px; border: 1px solid var(--line); border-radius: 4px; color: var(--ink); background: #fff; font: 1rem Arial, sans-serif; outline: none; }
        input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #d65a3a22; }
        button { padding: 0 20px; border: 0; border-radius: 4px; color: #fff; background: var(--accent); font: 700 .9rem Arial, sans-serif; cursor: pointer; }
        button:hover { background: var(--accent-dark); }
        .clear-button { display: block; margin: 12px 14px 0 auto; padding: 8px 12px; border: 1px solid var(--line); color: var(--muted); background: transparent; font-size: .75rem; }
        .clear-button:hover { border-color: var(--accent); color: var(--accent-dark); background: transparent; }
        #status { min-height: 18px; margin: 10px 2px 0; color: var(--muted); font: .8rem Arial, sans-serif; }

        @media (max-width: 600px) {
            body { padding: 28px 12px; }
            header { align-items: start; flex-direction: column; }
            .subtitle { max-width: none; text-align: left; }
            .composer { grid-template-columns: 1fr; }
            button { min-height: 44px; }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <div>
                <p class="eyebrow">Open conversation</p>
                <h1>Real-Time Room</h1>
            </div>
            <p class="subtitle">A shared place for the latest thoughts.</p>
        </header>

        <section class="chat-panel" aria-label="Chat room">
            <div id="messages" aria-live="polite"></div>
            <button type="button" class="clear-button" id="clearButton" aria-label="Clear chat history">Clear chat history</button>
            <form class="composer" id="composer">
                <input type="text" id="namebox" placeholder="Your name" maxlength="30" aria-label="Your name" required />
                <input type="text" id="chatbox" placeholder="Write a message..." maxlength="500" aria-label="Message" required />
                <button type="submit">Send</button>
            </form>
        </section>
        <p id="status" role="status"></p>
    </main>

    <script>
        const socket = new WebSocket('wss://chat-room-yjg6.onrender.com');
        const messagesDiv = document.getElementById('messages');
        const namebox = document.getElementById('namebox');
        const chatbox = document.getElementById('chatbox');
        const composer = document.getElementById('composer');
        const clearButton = document.getElementById('clearButton');
        const status = document.getElementById('status');

        namebox.value = localStorage.getItem('chatName') || '';

        function addMessage(message) {
            const messageElement = document.createElement('p');
            const nameElement = document.createElement('b');
            let nameHash = 0;
            for (const character of message.name) {
                nameHash = ((nameHash << 5) - nameHash) + character.codePointAt(0);
                nameHash |= 0;
            }
            nameElement.style.color = `hsl(${Math.abs(nameHash) % 360} 58% 34%)`;
            nameElement.textContent = `${message.name}: `;
            messageElement.append(nameElement, document.createTextNode(message.text));
            messagesDiv.appendChild(messageElement);
        }

        socket.addEventListener('message', (event) => {
            try {
                const data = JSON.parse(event.data);
                if (data.type === 'history') {
                    data.messages.forEach(addMessage);
                    status.textContent = data.messages.length ? `${data.messages.length} earlier message${data.messages.length === 1 ? '' : 's'} loaded.` : '';
                } else if (data.type === 'message') {
                    addMessage(data.message);
                    status.textContent = '';
                } else if (data.type === 'historyCleared') {
                    messagesDiv.replaceChildren();
                    status.textContent = 'Chat history cleared.';
                }
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            } catch (error) {
                console.error('Could not read server message:', error);
            }
        });

        function sendMessage() {
            const name = namebox.value.trim();
            const text = chatbox.value.trim();
            if (!name || !text || socket.readyState !== WebSocket.OPEN) return;

            localStorage.setItem('chatName', name);
            socket.send(JSON.stringify({ name, text }));

            chatbox.value = '';
        }

        composer.addEventListener('submit', (event) => {
            event.preventDefault();
            sendMessage();
        });

        clearButton.addEventListener('click', () => {
            if (socket.readyState !== WebSocket.OPEN) return;
            if (!confirm('Clear the chat history for everyone?')) return;

            socket.send(JSON.stringify({ type: 'clearHistory' }));
        });
    </script>
</body>
</html>
