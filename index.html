<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WebSocket Multi-Client Chat</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #chatbox { width: 300px; height: 20px; }
        #messages { border: 1px solid #ccc; height: 200px; overflow-y: scroll; margin-top: 10px; padding: 10px; }
    </style>
</head>
<body>
    <h3>Real-Time Room</h3>
    <input type="text" id="namebox" placeholder="Your name" maxlength="30" />
    <input type="text" id="chatbox" placeholder="Type a message..." maxlength="500" />
    <button onclick="sendMessage()">Send</button>
    
    <div id="messages"></div>

    <script>
        const socket = new WebSocket('wss://chat-room-yjg6.onrender.com');
        const messagesDiv = document.getElementById('messages');
        const namebox = document.getElementById('namebox');
        const chatbox = document.getElementById('chatbox');

        namebox.value = localStorage.getItem('chatName') || '';

        function addMessage(message) {
            const messageElement = document.createElement('p');
            const nameElement = document.createElement('b');
            nameElement.textContent = `${message.name}: `;
            messageElement.append(nameElement, document.createTextNode(message.text));
            messagesDiv.appendChild(messageElement);
        }

        socket.addEventListener('message', (event) => {
            try {
                const data = JSON.parse(event.data);
                if (data.type === 'history') {
                    data.messages.forEach(addMessage);
                } else if (data.type === 'message') {
                    addMessage(data.message);
                }
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            } catch (error) {
                console.error('Could not read server message:', error);
            }
        });

        function sendMessage() {
            const name = namebox.value.trim();
            const text = chatbox.value.trim();
            if (!name || !text || socket.readyState !== WebSocket.OPEN) return;

            localStorage.setItem('chatName', name);
            socket.send(JSON.stringify({ name, text }));

            chatbox.value = '';
        }

        // Allow pressing "Enter" to send
        chatbox.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
